<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}iGMS Dynamic Pricing{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "inverse-on-surface": "#eff1f3",
            "surface": "#f7f9fb",
            "on-surface-variant": "#404752",
            "primary-container": "#2196f3",
            "surface-dim": "#d8dadc",
            "on-secondary-fixed-variant": "#930005",
            "on-secondary-fixed": "#410001",
            "on-error-container": "#93000a",
            "tertiary-container": "#00a0b5",
            "tertiary": "#006876",
            "on-secondary-container": "#fffbff",
            "on-primary": "#ffffff",
            "primary-fixed": "#d1e4ff",
            "error-container": "#ffdad6",
            "on-primary-container": "#002c4f",
            "surface-variant": "#e0e3e5",
            "secondary": "#b81311",
            "secondary-container": "#dc3128",
            "on-secondary": "#ffffff",
            "outline": "#707883",
            "tertiary-fixed-dim": "#44d8f1",
            "inverse-surface": "#2d3133",
            "surface-container-high": "#e6e8ea",
            "primary-fixed-dim": "#9ecaff",
            "on-primary-fixed": "#001d36",
            "tertiary-fixed": "#a1efff",
            "secondary-fixed": "#ffdad5",
            "on-error": "#ffffff",
            "background": "#f7f9fb",
            "surface-tint": "#0061a4",
            "on-tertiary-fixed": "#001f25",
            "on-primary-fixed-variant": "#00497d",
            "on-tertiary-container": "#003037",
            "surface-container-low": "#f2f4f6",
            "on-background": "#191c1e",
            "on-tertiary-fixed-variant": "#004e59",
            "outline-variant": "#bfc7d4",
            "on-tertiary": "#ffffff",
            "surface-container": "#eceef0",
            "primary": "#0061a4",
            "surface-bright": "#f7f9fb",
            "surface-container-highest": "#e0e3e5",
            "error": "#ba1a1a",
            "inverse-primary": "#9ecaff",
            "secondary-fixed-dim": "#ffb4a9",
            "surface-container-lowest": "#ffffff",
            "on-surface": "#191c1e"
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px",
            "liquid": "24px 8px 24px 8px"
          },
          spacing: {
            "gutter": "24px",
            "margin-desktop": "64px",
            "liquid-padding": "32px",
            "margin-mobile": "20px",
            "base-unit": "8px"
          },
          fontFamily: {
            "price-display": ["Hanken Grotesk"],
            "headline-lg": ["Plus Jakarta Sans"],
            "label-sm": ["Hanken Grotesk"],
            "display-lg": ["Plus Jakarta Sans"],
            "headline-lg-mobile": ["Plus Jakarta Sans"],
            "body-md": ["Plus Jakarta Sans"]
          },
          fontSize: {
            "price-display": ["20px", { "lineHeight": "24px", "letterSpacing": "0.02em", "fontWeight": "700" }],
            "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
            "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }],
            "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
            "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
            "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body class="bg-background text-on-background min-h-screen font-body-md antialiased">
  <!-- TOP BAR — no sidebar -->
  <header class="sticky top-0 z-50 bg-surface/80 backdrop-blur-xl shadow-[0_20px_40px_rgba(0,97,164,0.08)] px-margin-mobile md:px-margin-desktop py-4 flex items-center justify-between">
    <div class="flex items-center gap-4">
      <h1 class="font-display-lg text-primary tracking-tight text-2xl md:text-3xl font-bold" style="letter-spacing: -0.02em;">iGMS Pricing</h1>
      <div class="flex items-center gap-2">
        <select id="property-switcher" class="property-switcher bg-surface border border-surface-variant rounded-full px-4 py-2 text-sm font-body-md text-on-surface cursor-pointer focus:ring-2 focus:ring-primary/20 outline-none">
          {% for prop in properties %}
          <option value="{{ prop.property_uid }}" {% if prop.property_uid == current_uid %}selected{% endif %}>{{ prop.name }}</option>
          {% endfor %}
        </select>
        <button id="add-property-btn" class="flex items-center gap-1.5 px-3 py-2 rounded-full bg-surface-container-low border border-surface-variant text-on-surface-variant text-label-sm font-semibold hover:bg-surface-container-high hover:text-on-surface transition-all">
          <span class="material-symbols-outlined text-sm">add</span>
          Add Property
        </button>
      </div>
    </div>
    <div class="flex items-center gap-6">
      <a href="/calendar" class="font-body-md text-on-surface-variant hover:text-primary transition-colors text-sm font-medium">Calendar</a>
      <a href="/config-editor" class="font-body-md text-on-surface-variant hover:text-primary transition-colors text-sm font-medium">Config</a>
    </div>
  </header>

  <!-- PAGE CONTENT -->
  <main class="px-margin-mobile md:px-margin-desktop py-8 md:py-12">
    {% block content %}{% endblock %}
  </main>

  <!-- DAY POPUP — anchored side card (desktop) / centered card (mobile) -->
  <div id="day-popup-layer" class="fixed inset-0 z-50 hidden pointer-events-none" aria-hidden="true">
    <div id="day-popup-card" class="day-popup-card">
      <div class="popup-header">
        <div>
          <h2 id="popup-date" class="popup-date-text"></h2>
          <p id="popup-property" class="popup-sub-text"></p>
        </div>
        <button id="popup-close-btn" class="popup-close-btn">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div id="popup-content" class="popup-content"></div>
      <div id="popup-footer" class="popup-footer"></div>
    </div>
  </div>


  <script>
    // Property switcher
    document.getElementById('property-switcher')?.addEventListener('change', function() {
      localStorage.setItem('atlas_property_uid', this.value);
      const uidRef = document.getElementById("property-uid-ref");
      if (uidRef) uidRef.textContent = this.value;
      const url = new URL(window.location);
      url.searchParams.set('property_uid', this.value);
      window.location.href = window.location.pathname + '?property_uid=' + this.value;
    });
  </script>

  <!-- STATUS BAR — fixed bottom-right -->
  <div id="status-bar" class="fixed bottom-6 right-6 z-40 flex flex-col gap-2 items-end">
    <!-- iGMS fetch status -->
    <div id="fetch-status" class="bg-surface-container-lowest rounded-full px-3 py-2 shadow-[0_4px_16px_rgba(0,0,0,0.12)] border border-surface-container flex items-center gap-1.5 text-xs text-on-surface-variant opacity-0 transition-opacity duration-300">
      <span id="fetch-dot" class="w-2 h-2 rounded-full bg-outline flex-shrink-0"></span>
      <span id="fetch-time" class="font-medium text-on-surface font-label-sm">—</span>
    </div>
    <!-- Refresh button -->
    <button id="refresh-btn" onclick="refreshCalendar()" class="bg-surface-container-lowest rounded-full px-3 py-2 shadow-[0_4px_16px_rgba(0,0,0,0.12)] border border-surface-container flex items-center gap-1.5 text-xs text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-all cursor-pointer">
      <span class="material-symbols-outlined text-sm">sync</span>
      <span class="font-label-sm font-medium">Refresh</span>
    </button>
  </div>
  <div id="add-property-modal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" id="add-property-backdrop"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-lg bg-surface-container-lowest rounded-2xl shadow-2xl p-6 border border-surface-container">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-headline-lg-mobile text-on-surface">Add Property</h3>
        <button id="add-property-close" class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant hover:bg-surface-container-highest transition-colors">
          <span class="material-symbols-outlined text-sm">close</span>
        </button>
      </div>
      <div id="add-property-content">
        <div class="text-center py-12 text-on-surface-variant">Loading...</div>
      </div>
    </div>
  </div>
  <script type="module" src="/static/js/properties_modal.js"></script>
</body>
</html>
