<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}iGMS Dynamic Pricing{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "inverse-on-surface": "#eff1f3",
            "surface": "#f7f9fb",
            "on-surface-variant": "#404752",
            "primary-container": "#2196f3",
            "surface-dim": "#d8dadc",
            "on-secondary-fixed-variant": "#930005",
            "on-secondary-fixed": "#410001",
            "on-error-container": "#93000a",
            "tertiary-container": "#00a0b5",
            "tertiary": "#006876",
            "on-secondary-container": "#fffbff",
            "on-primary": "#ffffff",
            "primary-fixed": "#d1e4ff",
            "error-container": "#ffdad6",
            "on-primary-container": "#002c4f",
            "surface-variant": "#e0e3e5",
            "secondary": "#b81311",
            "secondary-container": "#dc3128",
            "on-secondary": "#ffffff",
            "outline": "#707883",
            "tertiary-fixed-dim": "#44d8f1",
            "inverse-surface": "#2d3133",
            "surface-container-high": "#e6e8ea",
            "primary-fixed-dim": "#9ecaff",
            "on-primary-fixed": "#001d36",
            "tertiary-fixed": "#a1efff",
            "secondary-fixed": "#ffdad5",
            "on-error": "#ffffff",
            "background": "#f7f9fb",
            "surface-tint": "#0061a4",
            "on-tertiary-fixed": "#001f25",
            "on-primary-fixed-variant": "#00497d",
            "on-tertiary-container": "#003037",
            "surface-container-low": "#f2f4f6",
            "on-background": "#191c1e",
            "on-tertiary-fixed-variant": "#004e59",
            "outline-variant": "#bfc7d4",
            "on-tertiary": "#ffffff",
            "surface-container": "#eceef0",
            "primary": "#0061a4",
            "surface-bright": "#f7f9fb",
            "surface-container-highest": "#e0e3e5",
            "error": "#ba1a1a",
            "inverse-primary": "#9ecaff",
            "secondary-fixed-dim": "#ffb4a9",
            "surface-container-lowest": "#ffffff",
            "on-surface": "#191c1e"
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px",
            "liquid": "24px 8px 24px 8px"
          },
          spacing: {
            "gutter": "24px",
            "margin-desktop": "64px",
            "liquid-padding": "32px",
            "margin-mobile": "20px",
            "base-unit": "8px"
          },
          fontFamily: {
            "price-display": ["Hanken Grotesk"],
            "headline-lg": ["Plus Jakarta Sans"],
            "label-sm": ["Hanken Grotesk"],
            "display-lg": ["Plus Jakarta Sans"],
            "headline-lg-mobile": ["Plus Jakarta Sans"],
            "body-md": ["Plus Jakarta Sans"]
          },
          fontSize: {
            "price-display": ["20px", { "lineHeight": "24px", "letterSpacing": "0.02em", "fontWeight": "700" }],
            "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
            "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }],
            "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
            "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
            "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body class="bg-background text-on-background min-h-screen font-body-md antialiased">
  <!-- TOP BAR — no sidebar -->
  <header class="sticky top-0 z-50 bg-surface/80 backdrop-blur-xl shadow-[0_20px_40px_rgba(0,97,164,0.08)] px-margin-mobile md:px-margin-desktop py-4 flex items-center justify-between">
    <div class="flex items-center gap-4">
      <h1 class="font-display-lg text-primary tracking-tight text-2xl md:text-3xl font-bold" style="letter-spacing: -0.02em;">iGMS Pricing</h1>
      <select id="property-switcher" class="property-switcher bg-surface border border-surface-variant rounded-full px-4 py-2 text-sm font-body-md text-on-surface cursor-pointer focus:ring-2 focus:ring-primary/20 outline-none">
        {% for prop in properties %}
        <option value="{{ prop.property_uid }}" {% if prop.property_uid == current_uid %}selected{% endif %}>{{ prop.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="flex items-center gap-6">
      <a href="/calendar" class="font-body-md text-on-surface-variant hover:text-primary transition-colors text-sm font-medium">Calendar</a>
      <a href="/config-editor" class="font-body-md text-on-surface-variant hover:text-primary transition-colors text-sm font-medium">Config</a>
    </div>
  </header>

  <!-- PAGE CONTENT -->
  <main class="px-margin-mobile md:px-margin-desktop py-8 md:py-12">
    {% block content %}{% endblock %}
  </main>

  <!-- DAY MODAL — full screen overlay -->
  <div id="day-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center" aria-modal="true">
    <div class="absolute inset-0 bg-black/30 backdrop-blur-sm" onclick="closeDayModal()"></div>
    <div class="relative bg-surface-container-lowest rounded-[24px] shadow-[0_30px_60px_rgba(33,150,243,0.15)]" style="max-width:360px;width:90%;padding:24px;">
      <div class="flex justify-between items-start mb-6">
        <div>
          <h2 id="modal-date" class="font-display-lg text-headline-lg text-on-surface"></h2>
          <p id="modal-property" class="text-label-sm text-on-surface-variant mt-1"></p>
        </div>
        <button onclick="closeDayModal()" class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center hover:bg-surface-container-highest transition-colors">
          <span class="material-symbols-outlined text-on-surface-variant">close</span>
        </button>
      </div>
      <div id="modal-content" class="space-y-4"></div>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/calendar.js"></script>
  <script src="/static/js/config_editor.js"></script>
  <script>
    // Property switcher
    document.getElementById('property-switcher')?.addEventListener('change', function() {
      localStorage.setItem('atlas_property_uid', this.value);
      const url = new URL(window.location);
      url.searchParams.set('property_uid', this.value);
      window.location.href = window.location.pathname + '?property_uid=' + this.value;
    });
    function closeDayModal() { document.getElementById('day-modal').classList.add('hidden'); }
  </script>

  <!-- STATUS BAR — fixed bottom-right -->
  <div id="status-bar" class="fixed bottom-6 right-6 z-40 flex flex-col gap-2 items-end">
    <!-- iGMS fetch status -->
    <div id="fetch-status" class="bg-surface-container-lowest rounded-full px-3 py-1.5 shadow-[0_4px_16px_rgba(0,0,0,0.12)] border border-surface-container flex items-center gap-1.5 text-xs text-on-surface-variant opacity-0 transition-opacity duration-300" style="min-width:80px">
      <span id="fetch-dot" class="w-2 h-2 rounded-full bg-outline flex-shrink-0"></span>
      <span id="fetch-time" class="font-medium text-on-surface font-label-sm">—</span>
    </div>
    <div id="save-status" class="bg-surface-container-lowest rounded-full px-3 py-1.5 shadow-[0_4px_16px_rgba(0,0,0,0.12)] border border-surface-container flex items-center gap-1.5 text-xs text-on-surface-variant opacity-0 transition-opacity duration-300" style="min-width:80px">
      <span id="save-dot" class="w-2 h-2 rounded-full bg-outline flex-shrink-0"></span>
      <span id="save-time" class="font-medium text-on-surface font-label-sm">—</span>
    </div>
    <!-- Refresh button -->
    <button id="refresh-btn" onclick="refreshCalendar()" class="bg-surface-container-lowest rounded-full px-4 py-2 shadow-[0_4px_16px_rgba(0,0,0,0.12)] border border-surface-container flex items-center gap-2 text-xs text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-all cursor-pointer">
      <span class="material-symbols-outlined text-sm">sync</span>
      <span class="font-label-sm font-medium">Refresh</span>
    </button>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
