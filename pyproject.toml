[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "igms-dynamic-pricing"
version = "0.1.0"
description = "Dynamic pricing engine for iGMS-managed short-term rental properties"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "igms-api-wrapper>=0.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.0",
    "holidays>=0.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "responses>=0.21.0",
]

[project.scripts]
igms-pricing = "pricing_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
